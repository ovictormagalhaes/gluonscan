version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned on purpose: this is the toolchain the MSRV job tests against, not a
      # dependency to track latest. Bump it only when the workspace MSRV changes.
      - dependency-name: dtolnay/rust-toolchain
