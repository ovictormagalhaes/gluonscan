name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: check on MSRV
        run: cargo check --workspace --all-targets

  hack:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # On PRs run `--each-feature` (linear in the number of features) so adding a protocol adds one
      # check, not doubling a `--feature-powerset` run. The full powerset (every subset) is
      # exponential and would grow unbounded with each adapter feature. Each-feature guarantees every
      # feature compiles on its own; the all-features-together case (where a feature-unification bug
      # would surface) is already covered by the `test`/`msrv` jobs, which build the default `full`
      # set. The exhaustive powerset still runs on pushes to `main`, where it never blocks a PR.
      - name: check feature combinations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo hack check --workspace --each-feature --no-dev-deps
          else
            cargo hack check --workspace --feature-powerset --no-dev-deps
          fi

  deny:
    name: cargo-deny (licenses · advisories · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  book:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@mdbook
      - name: build the book
        run: mdbook build
