name: release-plz

# Automated releases: opens a version-bump / changelog PR, and on merge publishes the crates to
# crates.io via OIDC trusted publishing. Inert until the repo variable PUBLISH_ENABLED == "true"
# (set it once crates.io trusted publishing is configured and the repo is public).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io auth (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `release` only: publish crates whose version is ahead of the registry, tag, and cut the
      # GitHub Release. The version bump is done manually in Cargo.toml (beta line), so the
      # release-PR command is not used — it also needs the org setting that lets Actions open PRs.
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
