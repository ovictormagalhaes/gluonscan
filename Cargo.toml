[workspace]
resolver = "2"
members = [
    "crates/gluonscan-core",
    "crates/gluonscan-math",
    "crates/gluonscan-evm",
    "crates/gluonscan-aave",
    "crates/gluonscan-uniswap",
    "crates/gluonscan-lido",
    "crates/gluonscan-pendle",
    "crates/gluonscan-kamino",
    "crates/gluonscan-solana",
    "crates/gluonscan-raydium",
    "crates/gluonscan-sources",
    "crates/gluonscan-wallet",
    "crates/gluonscan-testing",
    "crates/gluonscan",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ovictormagalhaes/gluonscan"
homepage = "https://github.com/ovictormagalhaes/gluonscan"
authors = ["Victor Magalhães"]

# Single source of truth for lint policy; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every #[allow(...)] must carry a reason=, so a suppression is always documented.
allow_attributes_without_reason = "warn"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.11"
bs58 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

gluonscan-core = { path = "crates/gluonscan-core", version = "0.1.0" }
gluonscan-math = { path = "crates/gluonscan-math", version = "0.1.0" }
gluonscan-aave = { path = "crates/gluonscan-aave", version = "0.1.0" }
gluonscan-uniswap = { path = "crates/gluonscan-uniswap", version = "0.1.0" }
gluonscan-lido = { path = "crates/gluonscan-lido", version = "0.1.0" }
gluonscan-pendle = { path = "crates/gluonscan-pendle", version = "0.1.0" }
gluonscan-kamino = { path = "crates/gluonscan-kamino", version = "0.1.0" }
gluonscan-solana = { path = "crates/gluonscan-solana", version = "0.1.0" }
gluonscan-raydium = { path = "crates/gluonscan-raydium", version = "0.1.0" }
gluonscan-sources = { path = "crates/gluonscan-sources", version = "0.1.0" }
gluonscan-wallet = { path = "crates/gluonscan-wallet", version = "0.1.0" }
gluonscan-evm = { path = "crates/gluonscan-evm", version = "0.1.0" }
# Dev-only helper: path-only (no version) so it is stripped from published manifests and never
# forces a publish-order constraint on the crates that dev-depend on it.
gluonscan-testing = { path = "crates/gluonscan-testing" }
