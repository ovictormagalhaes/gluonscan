[workspace]
resolver = "2"
members = [
    "crates/gluonscan-core",
    "crates/gluonscan-math",
    "crates/gluonscan-evm",
    "crates/gluonscan-aave",
    "crates/gluonscan-uniswap",
    "crates/gluonscan-pendle",
    "crates/gluonscan-kamino",
    "crates/gluonscan-solana",
    "crates/gluonscan-raydium",
    "crates/gluonscan-sources",
    "crates/gluonscan-wallet",
    "crates/gluonscan-testing",
    "crates/gluonscan",
]

[workspace.package]
version = "0.0.1-beta.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ovictormagalhaes/gluonscan"
authors = ["Victor Magalhães"]

# Single source of truth for lint policy; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

gluonscan-core = { path = "crates/gluonscan-core", version = "0.0.1-beta.1" }
gluonscan-math = { path = "crates/gluonscan-math", version = "0.0.1-beta.1" }
gluonscan-aave = { path = "crates/gluonscan-aave", version = "0.0.1-beta.1" }
gluonscan-uniswap = { path = "crates/gluonscan-uniswap", version = "0.0.1-beta.1" }
gluonscan-pendle = { path = "crates/gluonscan-pendle", version = "0.0.1-beta.1" }
gluonscan-kamino = { path = "crates/gluonscan-kamino", version = "0.0.1-beta.1" }
gluonscan-solana = { path = "crates/gluonscan-solana", version = "0.0.1-beta.1" }
gluonscan-raydium = { path = "crates/gluonscan-raydium", version = "0.0.1-beta.1" }
gluonscan-sources = { path = "crates/gluonscan-sources", version = "0.0.1-beta.1" }
gluonscan-wallet = { path = "crates/gluonscan-wallet", version = "0.0.1-beta.1" }
gluonscan-evm = { path = "crates/gluonscan-evm", version = "0.0.1-beta.1" }
gluonscan-testing = { path = "crates/gluonscan-testing", version = "0.0.1-beta.1" }
