[book]
title = "gluonscan"
description = "The multi-chain read + normalize engine for DeFi portfolios."
authors = ["Victor Magalhães"]
language = "en"
src = "book/src"

# Render outside book/ so the build never cleans the sources in book/src.
[build]
build-dir = "target/book"

[output.html]
theme = "book/theme"
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["book/theme/gluonscan.css"]
additional-js = ["book/theme/gluonscan.js"]
git-repository-url = "https://github.com/ovictormagalhaes/gluonscan"
