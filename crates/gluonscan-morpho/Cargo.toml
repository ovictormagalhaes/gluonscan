[package]
name = "gluonscan-morpho"
description = "Morpho Blue lending adapter for gluonscan (GraphQL API; isolated markets, per-market health factor)."
keywords = ["defi", "morpho", "lending", "ethereum", "base"]
categories = ["finance", "cryptography::cryptocurrencies"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gluonscan-core = { workspace = true }
async-trait = { workspace = true }
# arbitrary_precision: Morpho serializes base-unit amounts as JSON numbers, not strings. Default
# serde_json truncates integers above u64 to f64, which would silently corrupt large 18-decimal
# positions. This preserves the exact digits so amounts stay lossless.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
rust_decimal = { workspace = true }
alloy-primitives = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
gluonscan-testing = { workspace = true }
