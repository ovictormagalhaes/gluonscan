[package]
name = "gluonscan"
description = "Multi-chain read + normalize engine for DeFi portfolios. Reads chains & protocols, returns one normalized ledger. Stateless."
keywords = ["defi", "blockchain", "portfolio", "ethereum", "solana"]
categories = ["finance", "cryptography::cryptocurrencies"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
# Document every protocol/ecosystem on docs.rs, not just the default set.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gluonscan-core = { workspace = true }
gluonscan-math = { workspace = true }
gluonscan-aave = { workspace = true, optional = true }
gluonscan-uniswap = { workspace = true, optional = true }
gluonscan-pendle = { workspace = true, optional = true }
gluonscan-kamino = { workspace = true, optional = true }
gluonscan-raydium = { workspace = true, optional = true }
gluonscan-sources = { workspace = true, optional = true }
gluonscan-wallet = { workspace = true, optional = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[features]
# Convenience default: everything wired. Opt out with `default-features = false` and pick only the
# protocols you need, so a consumer never compiles an ecosystem's stack (EVM's alloy or Solana's
# crypto) it does not use. Features are additive, so widening them later is never a breaking change.
default = ["full"]
aave = ["dep:gluonscan-aave"]
uniswap = ["dep:gluonscan-uniswap"]
pendle = ["dep:gluonscan-pendle"]
kamino = ["dep:gluonscan-kamino"]
raydium = ["dep:gluonscan-raydium"]
prices = ["dep:gluonscan-sources"]
wallet = ["dep:gluonscan-wallet"]
# Ecosystem umbrellas.
evm = ["aave", "uniswap", "pendle"]
solana = ["kamino", "raydium"]
full = ["evm", "solana", "prices", "wallet"]

[dev-dependencies]
gluonscan-testing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
