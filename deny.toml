# cargo-deny configuration — supply-chain and license gates for CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained but has no known vulnerability; pulled in transitively by
    # alloy-primitives' ruint. No maintained drop-in replacement is wired upstream yet.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses compatible with a dual MIT / Apache-2.0 crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (Mozilla CA set, via reqwest's rustls) ships under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
